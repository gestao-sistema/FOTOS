<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mural Novitah</title>
<!-- Link proprio do mural da NOVITAH.
     Nao ha copia do mural aqui: este arquivo so abre o index.html pedindo
     a marca NOVITAH. Assim existe um so mural para dar manutencao, e cada
     marca tem o seu endereco:
        .../                -> ALINARE e GRACE
        .../novitah.html    -> NOVITAH
     Para criar o link de uma marca nova, copie este arquivo trocando o
     nome da marca nas duas linhas abaixo. -->
<meta http-equiv="refresh" content="0; url=./?marcas=NOVITAH">
<style>
  html,body{height:100%;margin:0;background:#0a1224;color:#c9d2e2;
            font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
  div{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
  a{color:#e6cf96}
</style>
</head>
<body>
<div>
  <p>Abrindo o mural da Novitah...<br>
  Se esta página não mudar sozinha, <a href="./?marcas=NOVITAH">toque aqui</a>.</p>
</div>
<script>location.replace('./?marcas=NOVITAH');</script>
</body>
</html>
