<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Mural Azime</title>
<style>
  :root{ --ink:#0d1730; --gold:#c9a24a; --goldl:#e6cf96; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0a1224;overflow:hidden;-webkit-user-select:none;user-select:none;
            font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body.rodando{cursor:none}

  /* ---------- palco ---------- */
  #stage{position:fixed;inset:0;background:#0a1224}
  .layer{position:absolute;inset:0;opacity:0;transition:opacity var(--fade,1.2s) ease}
  .layer.on{opacity:1}
  .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(38px) brightness(.45);transform:scale(1.15)}
  .pic{position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat}
  .vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0a1224;display:none}
  .layer.video .vid{display:block}
  .layer.video .bg, .layer.video .pic{display:none}
  .layer.on .pic.zoom{animation:kb var(--dur,8s) ease-out forwards}
  @keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.10)}}
  #vin{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 240px rgba(0,0,0,.5)}
  #prog{position:fixed;left:0;top:0;height:4px;background:var(--gold);width:0;z-index:6;box-shadow:0 0 10px var(--gold);display:none}

  /* ---------- relogio / logo (desligados por padrao) ---------- */
  #clock{position:fixed;left:44px;bottom:36px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7);z-index:5;display:none}
  #hora{font-size:58px;font-weight:300;letter-spacing:1px;font-variant-numeric:tabular-nums}
  #data{font-size:20px;color:#e7ecf5;text-transform:capitalize;margin-top:-4px}
  #logo{position:fixed;right:44px;bottom:40px;color:#fff;text-align:right;z-index:5;display:none;text-shadow:0 2px 14px rgba(0,0,0,.7)}
  #logo .mark{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:9px;background:rgba(0,0,0,.35);border:1px solid rgba(201,162,74,.5);color:var(--goldl);font-size:20px;margin-bottom:6px}
  #logo .nm{font-size:17px;font-weight:600;letter-spacing:3px}
  #logo .sb{font-size:11px;color:var(--goldl);letter-spacing:2px}

  /* ---------- tela de escolha ---------- */
  #inicio{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:auto;
          background:linear-gradient(135deg,#12203f,#0a1224);color:#fff}
  .card{width:100%;max-width:760px;text-align:center;padding:36px 26px 48px}
  .card .ask{color:#c9d2e2;font-size:16px;margin:34px 0 14px}

  /* ---------- marca: nome em dourado + diamante brilhando ---------- */
  .marca{display:grid;place-items:center;gap:6px}
  .diamante{width:84px;height:84px;overflow:visible;filter:drop-shadow(0 4px 18px rgba(201,162,74,.45))}
  .diamante .pedra{animation:flutua 4.5s ease-in-out infinite}
  @keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .diamante .lampejo{animation:lampejo 3.4s ease-in-out infinite}
  @keyframes lampejo{0%,72%,100%{opacity:0}80%{opacity:.85}88%{opacity:.25}}
  .diamante .faisca{transform-box:fill-box;transform-origin:center;animation:faisca 2.6s ease-in-out infinite}
  .diamante .faisca:nth-of-type(2){animation-delay:.5s}
  .diamante .faisca:nth-of-type(3){animation-delay:1.1s}
  .diamante .faisca:nth-of-type(4){animation-delay:1.7s}
  @keyframes faisca{0%,100%{opacity:0;transform:scale(.4)}45%{opacity:1;transform:scale(1)}}

  #titulo{
    font-family:Georgia,"Times New Roman",serif;font-weight:400;
    font-size:clamp(34px,7.5vw,62px);line-height:1.08;letter-spacing:.5px;margin-top:6px;
    background-image:linear-gradient(100deg,#8a6a22 0%,#c9a24a 14%,#fff6dd 28%,#e6cf96 40%,
                     #c9a24a 54%,#fff8e3 68%,#e6cf96 82%,#8a6a22 100%);
    background-size:230% 100%;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:corre 7s linear infinite;
  }
  @keyframes corre{from{background-position:230% 0}to{background-position:-30% 0}}
  #subtitulo{color:var(--goldl);font-size:12px;letter-spacing:5px;text-transform:uppercase;opacity:.75}
  .risco{width:150px;height:1px;margin:14px 0 0;
         background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  @media (prefers-reduced-motion:reduce){
    .diamante .pedra,.diamante .lampejo,.diamante .faisca,#titulo{animation:none}
    #titulo{-webkit-text-fill-color:#e6cf96;color:#e6cf96}
  }

  #marcas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .chip{appearance:none;border:1.5px solid rgba(201,162,74,.45);background:rgba(255,255,255,.05);color:#e7ecf5;
        padding:16px 24px;border-radius:12px;font-size:17px;font-weight:600;letter-spacing:1px;cursor:pointer;
        transition:background .15s,border-color .15s,transform .1s;min-width:150px;text-align:center}
  .chip:active{transform:scale(.97)}
  .chip .qt{display:block;font-size:12px;font-weight:400;letter-spacing:0;color:#8fa0bd;margin-top:3px}
  .chip.on{background:linear-gradient(180deg,var(--goldl),var(--gold));border-color:var(--goldl);color:#12203f}
  .chip.on .qt{color:#3b3117}
  .chip:disabled{opacity:.35;cursor:default;border-style:dashed}
  .chip:disabled:active{transform:none}

  .btn{appearance:none;border:0;display:inline-block;margin-top:32px;padding:17px 44px;border-radius:12px;
       background:linear-gradient(180deg,var(--goldl),var(--gold));color:#12203f;font-weight:700;font-size:18px;cursor:pointer}
  .btn:disabled{opacity:.35;cursor:default}
  .btn:active:not(:disabled){transform:scale(.98)}
  .dica{color:#8fa0bd;font-size:13px;margin-top:22px;line-height:1.6}
  .dica code{background:rgba(255,255,255,.08);padding:2px 7px;border-radius:5px;color:var(--goldl);font-size:12px}
  .erro{color:#ffb4a2;font-size:14px;margin-top:18px;line-height:1.6}

  /* ---------- controles em cima da foto ---------- */
  #controles{position:fixed;inset:0;z-index:8;display:none;pointer-events:none;
             opacity:.28;transition:opacity .35s ease}
  #controles.ativo{opacity:1}
  body.rodando #controles{display:block}
  body.rodando.mexendo{cursor:default}
  .ctl{pointer-events:auto;position:fixed;appearance:none;cursor:pointer;color:#fff;
       background:rgba(6,12,26,.55);border:1px solid rgba(201,162,74,.5);
       -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
       transition:background .15s,transform .1s;display:grid;place-items:center}
  .ctl:active{background:rgba(201,162,74,.9);color:#12203f;transform:scale(.94)}
  .seta{top:50%;margin-top:-55px;width:66px;height:110px;border-radius:14px;
        font-size:32px;line-height:1;padding-bottom:4px}
  .seta.esq{left:18px}
  .seta.dir{right:18px}
  #btVoltar{top:18px;left:50%;transform:translateX(-50%);padding:13px 26px;border-radius:999px;
            font-size:15px;font-weight:600;letter-spacing:1px}
  #btVoltar:active{transform:translateX(-50%) scale(.96)}
  @media (max-width:600px){
    .seta{width:54px;height:92px;margin-top:-46px;font-size:26px}
    .seta.esq{left:10px} .seta.dir{right:10px}
  }

  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:30;display:none;
         background:rgba(6,12,26,.9);border:1px solid rgba(201,162,74,.35);color:#e7ecf5;
         padding:11px 20px;border-radius:10px;font-size:13px;text-align:center;max-width:88vw}
  @media (prefers-reduced-motion:reduce){.layer{transition:none}.layer.on .pic.zoom{animation:none}}
</style>
</head>
<body>

<!-- ================== CONFIGURACOES ================== -->
<script>
  const CONFIG = {
    // ---------------- AS TRES CAMADAS ----------------
    // Cada camada e um link. NAO renomeie as chaves (principal/grace/novitah):
    // os arquivos grace.html e novitah.html apontam para elas.
    //   .../             -> principal
    //   .../grace.html   -> grace
    //   .../novitah.html -> novitah
    // "chaves" sao as pastas dentro de FOTOS\ (MARCA e MARCA/LANCAMENTO).
    camadas: {
      principal: {
        titulo: "Alinare e Grace",
        todas: true,          // esta camada tem o botao TODAS
        botoes: [
          { rotulo: "LANÇAMENTO", chaves: ["ALINARE/LANCAMENTO", "GRACE/LANCAMENTO"] },
          { rotulo: "ALINARE",    chaves: ["ALINARE"] },
          { rotulo: "GRACE",      chaves: ["GRACE"] }
        ]
      },
      grace: {
        titulo: "Grace",
        todas: false,         // sem botao TODAS, como voce pediu
        botoes: [
          { rotulo: "LANÇAMENTO", chaves: ["GRACE/LANCAMENTO"] },
          { rotulo: "GRACE",      chaves: ["GRACE"] }
        ]
      },
      novitah: {
        titulo: "Novitah",
        todas: false,         // sem botao TODAS, como voce pediu
        botoes: [
          { rotulo: "NOVITAH",    chaves: ["NOVITAH"] },
          { rotulo: "LANÇAMENTO", chaves: ["NOVITAH/LANCAMENTO"] }
        ]
      }
    },
    camadaPadrao: "principal",

    mostrarControles: true, // setas nas laterais + botao Inicio no topo

    segundos: 3,            // tempo de cada foto
    transicao: 0.8,         // duracao do cruzamento entre uma foto e a outra
    ordemAleatoria: false,  // true = embaralha as fotos

    // true  = separa as versoes repetidas (COM LOGO/SEM LOGO/TV) e espalha
    //         os videos no meio das fotos
    // false = ordem crua das pastas, como estao no Windows
    ordemInteligente: true,
    efeitoZoom: true,       // zoom suave (Ken Burns)
    mostrarRelogio: false,  // relogio + data no canto
    mostrarLogo: false,     // logo GRUPO AZIME no canto
    mostrarBarra: false,    // barra de progresso no topo
    logoNome: "GRUPO AZIME",
    logoSub: "JOIAS QUE FICAM",
    atualizarMin: 5,        // re-checa novas fotos a cada X minutos (precisa do servidor)
    manterTelaLigada: true, // impede o tablet de apagar a tela

    // Video entra no meio das fotos, sem som (o navegador nao deixa comecar
    // com audio sozinho). Ja vem cortado em 15s pelo Atualizar fotos.cmd;
    // este numero e so a rede de seguranca, se o video travar no tablet.
    videoLimiteSegundos: 20
  };
</script>
<script src="fotos.js"></script>

<div id="stage">
  <div class="layer" id="L0"><div class="bg"></div><div class="pic"></div>
    <video class="vid" muted playsinline preload="auto"></video></div>
  <div class="layer" id="L1"><div class="bg"></div><div class="pic"></div>
    <video class="vid" muted playsinline preload="auto"></video></div>
</div>
<div id="vin"></div>
<div id="prog"></div>
<div id="clock"><div id="hora">--:--</div><div id="data">&mdash;</div></div>
<div id="logo"><div class="mark">&#9670;</div><div class="nm"></div><div class="sb"></div></div>

<div id="controles">
  <button class="ctl" id="btVoltar" title="Voltar para a escolha de marcas">&#9664;&nbsp; Início</button>
  <button class="ctl seta esq" id="btAnt"  title="Foto anterior" aria-label="Foto anterior">&#10094;</button>
  <button class="ctl seta dir" id="btProx" title="Próxima foto"  aria-label="Próxima foto">&#10095;</button>
</div>

<div id="inicio">
  <div class="card">
    <div class="marca">
      <svg class="diamante" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#fff8e3"/>
            <stop offset="42%"  stop-color="#e6cf96"/>
            <stop offset="100%" stop-color="#b8912f"/>
          </linearGradient>
          <linearGradient id="clarao" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
            <stop offset="50%"  stop-color="#fff" stop-opacity=".9"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <clipPath id="corte"><polygon points="60,20 94,44 60,104 26,44"/></clipPath>
        </defs>

        <g class="pedra">
          <polygon points="60,20 94,44 60,104 26,44" fill="url(#ouro)"/>
          <polygon points="60,20 94,44 60,44"        fill="#fff8e3" opacity=".55"/>
          <polygon points="60,20 26,44 60,44"        fill="#c9a24a" opacity=".45"/>
          <polygon points="26,44 60,104 60,44"       fill="#fff6dd" opacity=".28"/>
          <polygon points="94,44 60,104 60,44"       fill="#8a6a22" opacity=".30"/>
          <polyline points="26,44 94,44" stroke="#fff8e3" stroke-opacity=".6" fill="none" stroke-width="1.2"/>
          <g clip-path="url(#corte)">
            <rect class="lampejo" x="10" y="10" width="34" height="120" fill="url(#clarao)" transform="rotate(18 60 60)"/>
          </g>
        </g>

        <path class="faisca" d="M60 2 L62.5 13 L60 24 L57.5 13 Z"       fill="#fff8e3"/>
        <path class="faisca" d="M112 44 L101 46.5 L90 44 L101 41.5 Z"   fill="#fff8e3"/>
        <path class="faisca" d="M8 40 L19 42.5 L30 40 L19 37.5 Z"       fill="#e6cf96"/>
        <path class="faisca" d="M98 96 L100.5 88 L103 96 L100.5 104 Z"  fill="#fff8e3"/>
      </svg>

      <h1 id="titulo">Alinare e Grace</h1>
      <div id="subtitulo">Joias que ficam</div>
      <div class="risco"></div>
    </div>

    <div class="ask" id="pergunta">O que você quer que passe?</div>
    <div id="marcas"></div>

    <button class="btn" id="iniciar" disabled>&#9654; Iniciar em tela cheia</button>

    <div class="dica" id="dica">
      Toque em uma ou mais marcas e depois em <b>Iniciar</b>.<br>
      Já rodando, <b>toque 3 vezes na tela</b> para voltar aqui e trocar de marca.
    </div>
    <div class="erro" id="erro"></div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  const $  = function(id){ return document.getElementById(id); };
  const layers = [$('L0'), $('L1')];
  const prog = $('prog');
  const dur = Math.max(1, CONFIG.segundos || 8);
  // o cruzamento nunca passa de metade do tempo da foto, senao ela quase nao
  // fica parada na tela
  const fade = Math.min(CONFIG.transicao == null ? 1.2 : CONFIG.transicao, dur / 2);
  layers.forEach(function(l){ l.style.setProperty('--fade', fade + 's'); });

  let catalogo = {};      // { "MARCA" ou "MARCA/LANCAMENTO": [caminhos...] }
  let camada   = null;    // a camada deste link (principal / grace / novitah)
  let selecao  = [];      // rotulos de botao escolhidos
  let fotos    = [];      // playlist atual
  let idx = 0, cur = 0, timer = null, refreshTimer = null, rodando = false, wl = null;
  let token = 0;          // identifica o item atual: impede avanco em dobro no video

  /* ---------------- utilidades ---------------- */

  // encoda cada pedaco do caminho: resolve espaco, acento, # e & nos nomes das
  // pastas. O ?v=... do fim fica de fora do encode, senao o "?" viraria %3F
  function urlDe(rel){
    const i = rel.indexOf('?');
    const caminho = i < 0 ? rel : rel.slice(0, i);
    const versao  = i < 0 ? ''  : rel.slice(i);
    return caminho.split('/').map(encodeURIComponent).join('/') + versao;
  }
  function embaralha(a){
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function toast(txt, ms){
    const t = $('toast');
    t.textContent = txt;
    t.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.style.display = 'none'; }, ms || 4000);
  }
  function carregar(url){
    return new Promise(function(ok, falha){
      const im = new Image();
      im.onload  = function(){ ok(url); };
      im.onerror = function(){ falha(url); };
      im.src = url;
    });
  }

  /* ---------------- relogio / logo ---------------- */

  if (CONFIG.mostrarRelogio){
    $('clock').style.display = 'block';
    const h = $('hora'), dt = $('data');
    const fmt = new Intl.DateTimeFormat('pt-BR', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});
    (function tick(){
      const d = new Date();
      h.textContent  = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      dt.textContent = fmt.format(d);
      setTimeout(tick, 1000);
    })();
  }
  if (CONFIG.mostrarLogo){
    const l = $('logo');
    l.style.display = 'block';
    l.querySelector('.nm').textContent = CONFIG.logoNome || '';
    l.querySelector('.sb').textContent = CONFIG.logoSub || '';
  }
  if (CONFIG.mostrarBarra) prog.style.display = 'block';

  /* ---------------- catalogo de fotos ---------------- */

  // o PowerShell pode gravar uma marca de 1 foto so como texto em vez de lista
  function normalizar(marcas){
    const out = {};
    Object.keys(marcas || {}).forEach(function(m){
      const v = marcas[m];
      out[m] = Array.isArray(v) ? v : (typeof v === 'string' && v ? [v] : []);
    });
    return out;
  }

  async function lerCatalogo(){
    // 1) servidor rodando: le o fotos.json sempre fresco (pega fotos novas sozinho)
    try{
      const r = await fetch('fotos.json?_=' + Date.now(), {cache:'no-store'});
      if (r.ok){
        const j = await r.json();
        if (j && j.marcas) return normalizar(j.marcas);
      }
    }catch(e){ /* duplo-clique (file://) cai no plano B */ }

    // 2) plano B: fotos.js carregado junto com a pagina
    if (window.MURAL_FOTOS && window.MURAL_FOTOS.marcas) return normalizar(window.MURAL_FOTOS.marcas);
    return null;
  }

  /* ---------------- camadas ----------------
     A camada vem do endereco: ?camada=grace. Sem parametro, usa a padrao.
     ?marcas=NOVITAH continua funcionando, para nao quebrar link antigo.   */
  function lerCamada(){
    let p;
    try{ p = new URLSearchParams(location.search); }catch(e){ p = null; }
    const nomes = Object.keys(CONFIG.camadas || {});
    function achar(txt){
      if (!txt) return null;
      const alvo = String(txt).trim().toLowerCase();
      const k = nomes.filter(function(n){ return n.toLowerCase() === alvo; })[0];
      return k ? CONFIG.camadas[k] : null;
    }
    const porCamada = achar(p && p.get('camada'));
    if (porCamada) return porCamada;

    // compatibilidade com ?marcas=
    const marcas = p && p.get('marcas');
    if (marcas){
      const porNome = achar(marcas);
      if (porNome) return porNome;
      // marca avulsa que nao tem camada montada: cria uma na hora
      const bs = marcas.split(',').map(function(s){ return s.trim().toUpperCase(); }).filter(Boolean)
                       .map(function(t){ return { rotulo: t, chaves: [t] }; });
      if (bs.length) return { titulo: bs.map(function(b){ return b.rotulo; }).join(' e '), botoes: bs };
    }
    return CONFIG.camadas[CONFIG.camadaPadrao] || { titulo: 'Mural', botoes: [] };
  }

  function botoesDaCamada(){ return (camada && camada.botoes) || []; }
  function qtDoBotao(b){
    return (b.chaves || []).reduce(function(s, k){ return s + ((catalogo[k] || []).length); }, 0);
  }
  function botoesComItem(){
    return botoesDaCamada().filter(function(b){ return qtDoBotao(b) > 0; });
  }
  function botaoPorRotulo(r){
    return botoesDaCamada().filter(function(b){ return b.rotulo === r; })[0] || null;
  }

  function montarBotoes(){
    const box = $('marcas');
    box.innerHTML = '';
    const todos = botoesDaCamada();
    const comItem = botoesComItem();

    if (!comItem.length){
      $('pergunta').textContent = 'Nada para mostrar ainda';
      $('dica').innerHTML = 'Suba as fotos pelo <b>Painel</b> (<code>Abrir painel.cmd</code>), ' +
                            'ou coloque os arquivos em <code>FOTOS\\MARCA\\</code> e rode o ' +
                            '<code>Atualizar fotos.cmd</code>.<br>Subpastas <b>SEM TRATAR</b>, ' +
                            '<b>SEM EDIÇÃO</b> e <b>NÃO USAR</b> são ignoradas de propósito.';
      $('iniciar').disabled = true;
      return;
    }

    // com um botao so nao faz sentido "TODAS", nem deixar desmarcar o unico
    const umSo = comItem.length === 1;
    const querTodas = camada && camada.todas !== false;

    const itens = [];
    if (!umSo && querTodas){
      itens.push({
        rotulo: 'TODAS',
        qt: comItem.reduce(function(s, b){ return s + qtDoBotao(b); }, 0)
      });
    }
    todos.forEach(function(b){ itens.push({ rotulo: b.rotulo, qt: qtDoBotao(b) }); });

    itens.forEach(function(it){
      const b = document.createElement('button');
      b.className = 'chip';
      b.dataset.marca = it.rotulo === 'TODAS' ? '*' : it.rotulo;
      const legenda = it.qt > 0 ? (it.qt + (it.qt === 1 ? ' item' : ' itens')) : 'aguardando fotos';
      b.innerHTML = it.rotulo + '<span class="qt">' + legenda + '</span>';
      if (it.qt === 0){
        b.disabled = true;
        b.title = 'Nada em ' + it.rotulo + ' ainda';
      } else if (!umSo){
        b.addEventListener('click', function(){ alternar(b.dataset.marca); });
      }
      box.appendChild(b);
    });

    if (umSo){
      $('pergunta').textContent = 'Pronto para começar';
      $('dica').innerHTML = 'Toque em <b>Iniciar</b>. Passa sozinho, em loop.<br>' +
                            'Na tela, as setas passam os itens e <b>◀ Início</b> volta para cá.';
    }

    pintar();
  }

  function alternar(chave){
    const nomes = botoesComItem().map(function(b){ return b.rotulo; });
    if (chave === '*'){
      selecao = (selecao.length === nomes.length) ? [] : nomes.slice();
    } else if (selecao.indexOf(chave) >= 0){
      selecao = selecao.filter(function(m){ return m !== chave; });
    } else {
      selecao = selecao.concat([chave]);
    }
    pintar();
    salvarSelecao();
  }

  function pintar(){
    const nomes = botoesComItem().map(function(b){ return b.rotulo; });
    const todas = nomes.length > 0 && selecao.length === nomes.length;
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c){
      const m = c.dataset.marca;
      c.classList.toggle('on', m === '*' ? todas : selecao.indexOf(m) >= 0);
    });
    const qt = montarPlaylist().length;
    $('iniciar').disabled = qt === 0;
    $('iniciar').innerHTML = qt ? ('▶ Iniciar (' + qt + ' itens)') : '▶ Iniciar em tela cheia';
  }

  /* ---------- ordem da fila ----------
     O material vem em versoes do MESMO conteudo, em pastas irmas:
        VIDEOS\COM LOGO\FESTA.mp4  ·  VIDEOS\SEM LOGO\FESTA.mp4  ·  VIDEOS\TV\FESTA-TV.mp4
     Na ordem crua das pastas elas sairiam colidas, e quem esta na loja ve o
     mesmo video 3 vezes seguidas. Aqui elas sao separadas, e os videos ficam
     espalhados no meio das fotos em vez de virem em bloco.                  */

  // identidade do conteudo, ignorando o que e so "versao"
  function chaveGrupo(rel){
    let s = String(rel).replace(/\?.*$/, '').replace(/^_otimizadas\//i, '');
    const partes = s.split('/');
    const arq = partes.pop() || '';
    const pasta = partes.filter(function(p){
      return !/^(com|sem)\s*logo$/i.test(p) && !/^tv$/i.test(p) && !/^v[íi]deos?$/i.test(p);
    }).join('/').toLowerCase();
    const nome = arq.replace(/\.[a-z0-9]+$/i, '').toLowerCase()
      .replace(/\(?\s*(com|sem)\s*logo\s*\)?/g, '')
      .replace(/[-_\s]*\btv\b/g, '')
      .replace(/\b(copia|copiar|c[óo]pia|editar)\b/g, '')
      .replace(/\(\s*\d+\s*\)/g, '')
      .replace(/[^a-z0-9]+/g, '');
    return pasta + '|' + nome;
  }

  // mantem a ordem natural (as fotos de uma sessao continuam juntas) e apenas
  // ADIA quem repete um grupo visto nos ultimos 'janela' itens
  function distribuir(lista, janela){
    const W = janela || 12;
    const saida = [], espera = [], recente = [];

    function recenteTem(k){ return recente.indexOf(k) >= 0; }
    function empurrar(rel){
      saida.push(rel);
      recente.push(chaveGrupo(rel));
      if (recente.length > W) recente.shift();
    }
    function liberarUm(){
      for (let i = 0; i < espera.length; i++){
        if (!recenteTem(chaveGrupo(espera[i]))){ empurrar(espera.splice(i, 1)[0]); return true; }
      }
      return false;
    }

    // procura uma vaga com folga dos dois lados; usada para quem sobrou no fim
    // (sem isso, um par que esta no final da pasta acabaria colado de novo)
    function encaixar(rel){
      const k = chaveGrupo(rel);
      for (let p = saida.length; p >= 0; p--){
        let choca = false;
        for (let q = Math.max(0, p - W); q < Math.min(saida.length, p + W); q++){
          if (chaveGrupo(saida[q]) === k){ choca = true; break; }
        }
        if (!choca){ saida.splice(p, 0, rel); return; }
      }
      saida.push(rel);
    }

    lista.forEach(function(rel){
      liberarUm();
      if (recenteTem(chaveGrupo(rel))) espera.push(rel);
      else empurrar(rel);
    });
    // o que sobrou: primeiro tenta o fim, senao encaixa no meio
    while (espera.length){
      if (!liberarUm()) encaixar(espera.shift());
    }
    return saida;
  }

  // espalha os videos em intervalos iguais dentro das fotos
  function intercalar(fs, vs){
    if (!vs.length) return fs.slice();
    if (!fs.length) return vs.slice();
    const total = fs.length + vs.length;
    const passo = total / vs.length;
    const saida = [];
    let vi = 0, fi = 0;
    for (let pos = 0; pos < total; pos++){
      const alvo = Math.floor((vi + 0.5) * passo);
      if (vi < vs.length && (pos >= alvo || fi >= fs.length)) saida.push(vs[vi++]);
      else if (fi < fs.length) saida.push(fs[fi++]);
    }
    return saida;
  }

  function montarPlaylist(){
    const lista = [];
    selecao.forEach(function(rotulo){
      const b = botaoPorRotulo(rotulo);
      if (!b) return;
      (b.chaves || []).forEach(function(k){
        (catalogo[k] || []).forEach(function(p){ lista.push(p); });
      });
    });
    if (CONFIG.ordemInteligente === false) return lista;

    const fs = distribuir(lista.filter(function(r){ return !ehVideo(r); }));
    const vs = distribuir(lista.filter(function(r){ return  ehVideo(r); }));
    return intercalar(fs, vs);
  }

  // uma chave por camada: cada link lembra a escolha dele, senao um
  // sobrescreve a do outro (compartilham o mesmo dominio)
  function chaveGuardada(){
    return 'muralAzime.sel:' + (camada && camada.titulo) + '|' +
           botoesDaCamada().map(function(b){ return b.rotulo; }).join(',');
  }
  function salvarSelecao(){
    try{ localStorage.setItem(chaveGuardada(), JSON.stringify(selecao)); }catch(e){}
  }
  function lerSelecaoSalva(){
    try{
      const s = JSON.parse(localStorage.getItem(chaveGuardada()) || '[]');
      const nomes = botoesComItem().map(function(b){ return b.rotulo; });
      return Array.isArray(s) ? s.filter(function(m){ return nomes.indexOf(m) >= 0; }) : [];
    }catch(e){ return []; }
  }

  /* ---------------- slideshow ---------------- */

  // o que e video: a versao leve sai sempre em .mp4
  function ehVideo(rel){ return /\.(mp4|webm|ogv)(\?|$)/i.test(rel); }

  // barra de progresso acompanhando o tempo do item
  function progresso(segundos){
    if (!CONFIG.mostrarBarra) return;
    prog.style.transition = 'none'; prog.style.width = '0';
    requestAnimationFrame(function(){
      prog.style.transition = 'width ' + segundos + 's linear';
      prog.style.width = '100%';
    });
  }
  // pre-carrega o proximo item, se for foto (video seria peso demais)
  function preCarregar(){
    const nx = fotos[idx];
    if (nx && !ehVideo(nx)) { const p = new Image(); p.src = urlDe(nx); }
  }
  function pararVideoDe(L){
    const v = L.querySelector('.vid');
    if (!v) return;
    v.onended = null; v.onerror = null;
    try{ v.pause(); }catch(e){}
    if (v.getAttribute('src')){ v.removeAttribute('src'); try{ v.load(); }catch(e){} }
  }

  function mostrar(url){
    const prox = 1 - cur, L = layers[prox];
    pararVideoDe(L);
    L.classList.remove('video');
    L.querySelector('.bg').style.backgroundImage = 'url("' + url + '")';
    const pic = L.querySelector('.pic');
    pic.style.backgroundImage = 'url("' + url + '")';
    pic.classList.toggle('zoom', !!CONFIG.efeitoZoom);
    pic.style.setProperty('--dur', dur + 's');
    pic.style.animation = 'none'; void pic.offsetWidth; pic.style.animation = '';
    layers[cur].classList.remove('on');
    L.classList.add('on');
    pararVideoDe(layers[cur]);
    cur = prox;

    progresso(dur);
    preCarregar();
  }

  // video: entra sem som (navegador nao deixa som automatico) e, ao terminar,
  // ele mesmo chama o proximo item - nao espera o relogio das fotos
  function mostrarVideo(url){
    const prox = 1 - cur, L = layers[prox];
    const v = L.querySelector('.vid');
    if (!v) return false;

    const meuToken = ++token;
    L.classList.add('video');
    L.querySelector('.bg').style.backgroundImage = '';
    L.querySelector('.pic').style.backgroundImage = '';

    v.onended = function(){ seguir(meuToken); };
    v.onerror = function(){ seguir(meuToken); };
    v.muted = true; v.loop = false;
    v.setAttribute('src', url);
    try{ v.currentTime = 0; }catch(e){}
    try{ const p = v.play(); if (p && p.catch) p.catch(function(){ }); }catch(e){}

    layers[cur].classList.remove('on');
    L.classList.add('on');
    pararVideoDe(layers[cur]);
    cur = prox;

    const limite = Math.max(3, CONFIG.videoLimiteSegundos || 20);
    progresso(limite);
    // rede de seguranca: se o video travar e 'ended' nunca chegar
    clearTimeout(timer);
    timer = setTimeout(function(){ seguir(meuToken); }, limite * 1000);
    preCarregar();
    return true;
  }

  // avanca uma vez so, mesmo se 'ended' e a rede de seguranca dispararem juntos
  function seguir(meuToken){
    if (meuToken !== token || !rodando) return;
    clearTimeout(timer);
    passo();
  }

  // devolve 'foto', 'video' ou null
  async function proxima(){
    if (!fotos.length) return null;
    let tentativas = 0;
    while (tentativas < Math.min(fotos.length, 10)){
      const rel = fotos[idx];
      idx = (idx + 1) % fotos.length;

      if (ehVideo(rel)){
        if (mostrarVideo(urlDe(rel))) return 'video';
        tentativas++;
        continue;
      }
      try{
        const url = await carregar(urlDe(rel));
        token++;
        mostrar(url);
        return 'foto';
      }catch(e){
        // arquivo que nao abre (movido, formato nao suportado): tira da lista
        fotos = fotos.filter(function(f){ return f !== rel; });
        if (!fotos.length){ pararLoop(); voltarInicio('As fotos da seleção não abriram.'); return null; }
        idx = idx % fotos.length;
        tentativas++;
      }
    }
    return null;
  }

  // foto: o relogio marca a troca. video: quem marca e o fim dele.
  async function passo(){
    const tipo = await proxima();
    if (tipo === 'foto') agendar();
  }
  function agendar(){
    clearTimeout(timer);
    timer = setTimeout(passo, dur * 1000);
  }
  function pararLoop(){ clearTimeout(timer); timer = null; }

  async function comecar(){
    fotos = montarPlaylist();
    if (CONFIG.ordemAleatoria) embaralha(fotos);
    if (!fotos.length) return;
    idx = 0; rodando = true;
    document.body.classList.add('rodando');
    $('inicio').style.display = 'none';
    try{ const el = document.documentElement; if (el.requestFullscreen) el.requestFullscreen(); }catch(e){}
    manterAcordado();
    await passo();   // passo() so agenda o relogio se o item for foto
    acordar();       // mostra as setas por alguns segundos, para quem nao sabe que existem
  }

  function voltarInicio(msg){
    rodando = false;
    token++;                 // invalida qualquer 'ended' de video que ainda venha
    pararLoop();
    document.body.classList.remove('rodando');
    layers.forEach(function(l){ l.classList.remove('on'); pararVideoDe(l); l.classList.remove('video'); });
    $('erro').textContent = msg || '';
    $('inicio').style.display = 'grid';
    pintar();
  }

  /* ---------------- tela sempre ligada ---------------- */

  async function manterAcordado(){
    if (!CONFIG.manterTelaLigada || !('wakeLock' in navigator)) return;
    try{
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', function(){ wl = null; });
    }catch(e){ /* sem suporte: use o Fully Kiosk pra manter a tela ligada */ }
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && rodando && !wl) manterAcordado();
  });

  /* ---------------- atualizacao automatica ---------------- */

  async function rechecar(){
    const novo = await lerCatalogo();
    if (!novo) return;
    const antes = JSON.stringify(catalogo);
    if (JSON.stringify(novo) === antes) return;

    catalogo = novo;
    if (rodando){
      const atual = fotos[(idx - 1 + fotos.length) % fotos.length];
      const nova = montarPlaylist();
      if (CONFIG.ordemAleatoria) embaralha(nova);
      if (nova.length){
        fotos = nova;
        const pos = fotos.indexOf(atual);
        idx = pos >= 0 ? (pos + 1) % fotos.length : 0;
      }
    } else {
      montarBotoes();
    }
  }

  /* ---------------- controles ---------------- */

  $('iniciar').addEventListener('click', comecar);

  // ---- setas e botao Inicio sobre a foto ----
  // ficam discretos e acendem ao toque/mouse, para nao poluir o mural
  const painel = $('controles');
  let tApagar = null;
  function acordar(){
    if (!rodando || !CONFIG.mostrarControles) return;
    painel.classList.add('ativo');
    document.body.classList.add('mexendo');
    clearTimeout(tApagar);
    tApagar = setTimeout(function(){
      painel.classList.remove('ativo');
      document.body.classList.remove('mexendo');
    }, 3500);
  }
  document.addEventListener('pointermove', acordar, {passive:true});

  // avanca/volta um item na mao, cortando video que esteja tocando
  async function pular(direcao){
    if (!fotos.length) return;
    token++;
    pararLoop();
    if (direcao < 0) idx = (idx - 2 + fotos.length) % fotos.length;
    await passo();
  }

  $('btProx').addEventListener('click', function(e){ e.stopPropagation(); acordar(); pular(1); });
  $('btAnt').addEventListener('click',  function(e){ e.stopPropagation(); acordar(); pular(-1); });
  $('btVoltar').addEventListener('click', function(e){ e.stopPropagation(); voltarInicio(); });

  if (!CONFIG.mostrarControles) painel.style.display = 'none';

  // 3 toques rapidos = volta pra escolha de marcas (atalho antigo, ainda vale)
  let toques = 0, tToques = null;
  document.addEventListener('pointerdown', function(e){
    acordar();
    if (!rodando) return;
    // toque nos botoes nao conta para o triplo-toque
    if (e.target && e.target.closest && e.target.closest('#controles')) return;
    toques++;
    clearTimeout(tToques);
    tToques = setTimeout(function(){ toques = 0; }, 900);
    if (toques >= 3){ toques = 0; voltarInicio(); }
  });

  // arrastar pro lado = navega
  let x0 = null;
  document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', async function(e){
    if (!rodando || x0 === null || !fotos.length) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) < 70) return;
    await pular(dx < 0 ? 1 : -1);
  }, {passive:true});

  document.addEventListener('keydown', async function(e){
    if (e.key === 'f' || e.key === 'F'){
      const el = document.documentElement;
      if (document.fullscreenElement){ document.exitFullscreen(); } else if (el.requestFullscreen){ el.requestFullscreen(); }
      return;
    }
    if (e.key === 'Escape' && rodando){ voltarInicio(); return; }
    if (e.key === 'i' || e.key === 'I'){
      toast('Marcas: ' + (selecao.join(', ') || 'nenhuma') + '  ·  ' + fotos.length + ' fotos na fila' +
            (window.location.protocol === 'file:' ? '  ·  modo arquivo (sem atualização automática)' : ''), 6000);
      return;
    }
    if (!rodando || !fotos.length) return;
    if (e.key === 'ArrowRight'){ await pular(1); }
    if (e.key === 'ArrowLeft'){ await pular(-1); }
  });

  /* ---------------- start ---------------- */

  (async function(){
    // o nome da camada vira o titulo em dourado da tela inicial e da aba
    camada = lerCamada();
    $('titulo').textContent = camada.titulo || 'Mural';
    $('subtitulo').textContent = CONFIG.logoSub || 'Joias que ficam';
    document.title = camada.titulo || 'Mural';

    const cat = await lerCatalogo();
    if (!cat){
      $('pergunta').textContent = 'Lista de fotos não encontrada';
      $('dica').innerHTML = 'Rode o <code>Atualizar fotos.cmd</code> uma vez para gerar a lista ' +
                            '(ele cria o arquivo <code>fotos.js</code>), depois recarregue esta página.';
      $('iniciar').disabled = true;
      return;
    }
    catalogo = cat;
    montarBotoes();

    // volta a selecao da ultima vez; se nao houver, comeca com TODAS
    const salva = lerSelecaoSalva();
    selecao = salva.length ? salva : botoesComItem().map(function(b){ return b.rotulo; });
    pintar();

    clearInterval(refreshTimer);
    refreshTimer = setInterval(rechecar, Math.max(1, CONFIG.atualizarMin || 5) * 60000);
  })();

})();
</script>
</body>
